name: Build and Push WF

# Run this workflow for changes targeting the main branch.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  # Identify critical and high vulnerabilities before building the image.
  Security_Scan:
    runs-on: ubuntu-latest
    steps: 
      - name: "Code checkout"
        uses: actions/checkout@v5
        with:
            fetch-depth: 0

      - name: "Run Trivy filesystem scan"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: json
          output: trivy-results.json
          # Study purposes only: keep exit-code at 0 so findings do not fail the workflow.
          exit-code: 0
          severity: 'CRITICAL,HIGH'

          # Keep the scan report available for review, including after failures.
      - name: "Upload Trivy scan results as artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: trivy-results.json
    
  # Build and publish only after the security scan job completes successfully.
  Build:
    runs-on: ubuntu-latest
    # Use production environment controls and credentials for publishing.
    environment: production
    needs: Security_Scan
    steps:
      - name: "Code Checkout"
        uses: actions/checkout@v6

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      # Authenticate to Docker Hub using configured variables and secrets.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build and Push Docker Image"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/Dockerfile
          # Publish the image and reuse the GitHub Actions build cache.
          push: true
          # Append the commit SHA to the image tag to identify the build.
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/api-solid:latest
            ${{ vars.DOCKERHUB_USERNAME }}/api-solid:${{ github.sha }}
          # Restore cached BuildKit layers from the GitHub Actions cache to speed up builds.
          cache-from: type=gha
          # Save the build cache to GitHub Actions; mode=max includes intermediate build layers.
          cache-to: type=gha,mode=max

    